# Tasks:
# 1. Deploy yaml
# 2. Try to kill a pod and see what happens
# 3. redeploy pod
# 4. Try to update the pod, e.g. with a different arg
# 5. Delete the pod (without using "kubectl delete -f <yaml>"), wait until it is removed
