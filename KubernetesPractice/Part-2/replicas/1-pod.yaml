apiVersion: v1
kind: Pod
metadata:
  name: my-pod
spec:
  containers:
  - name: my-container
    image: ubuntu:20.04
    command: ["/bin/bash"]
    args: ["-c","echo hi;sleep 6000;echo bye!"]
