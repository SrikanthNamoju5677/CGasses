apiVersion: v1
kind: Pod
metadata:
  name: minimal-pod
spec:
  containers:
  - name: mycontainer
    image: python:3-alpine
    env:
    - name: POSTGRES_DBNAME
      valueFrom:
        secretKeyRef:
          name: postgresql-secret
          key: POSTGRES_USER
          
    - name: NORNMAL_ENV
      value: CeleryKubernetesExecutor
    - name: NUM_LIVES
      valueFrom:
        configMapKeyRef:
           name: game-demo
           key: player_initial_lives
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
type: Opaque
data:
  # Must be base64 encoded
  POSTGRES_USER: SXRzQVNlY3JldA==

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: game-demo
data:
  # property-like keys; each key maps to a simple value
  player_initial_lives: "3"
  ui_properties_file_name: "user-interface.properties"

  # file-like keys
  game.properties: |
    enemy.types=aliens,monsters
    player.maximum-lives=5    
  user-interface.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true    