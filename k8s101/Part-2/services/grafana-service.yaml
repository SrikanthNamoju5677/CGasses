apiVersion: v1
kind: Service
metadata:
  namespace: apps
  name: grafana
spec:
  type: LoadBalancer
  ports:
  - name: "ui"
    port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: grafana

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: apps
  annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port:   '3000'
spec:
  selector: 
    app: grafana
  type: NodePort  
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32000



