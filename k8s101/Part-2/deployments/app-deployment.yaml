apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/grid-default: "true"
        app: app
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      containers:
        - args:
            - sh
            - -c
            - yarn install && yarn run dev
          env:
            - name: MYSQL_DB
              value: todos
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PASSWORD
              value: secret
            - name: MYSQL_USER
              value: root
          image: k8s101.azurecr.io/grid_app:v2
          name: app
          ports:
            - containerPort: 4000
            - containerPort: 8080
          resources:
            limits:
              memory: 2048Mi
              cpu: 500m
            requests:
              memory: 100Mi
              cpu: 100m
      hostname: app
      restartPolicy: Always

status: {}
